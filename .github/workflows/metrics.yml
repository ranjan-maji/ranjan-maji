name: GitHub Metrics

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/metrics.yml"
      - "README.md"
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate profile metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ github.token }}
          user: ranjan-maji
          filename: metrics.svg
          base: header, activity, community, repositories, metadata
